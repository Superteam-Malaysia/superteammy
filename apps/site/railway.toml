# Staging Canva-embed experiment — do not use on production superteammy.
# Skips migrate/seed/telegram webhook so shared Postgres and the prod bot stay untouched.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npx next start -H 0.0.0.0 -p ${PORT:-8080}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
