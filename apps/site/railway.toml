# Superteam Malaysia + Startup Village Borneo — https://my.superteam.fun and /borneo
[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "bash scripts/start-production.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/borneo"
timeout = 300
