# Superteam Malaysia + Startup Village Borneo — https://my.superteam.fun and /borneo
[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npm start"
preDeployCommand = "npm run borneo:generate-ics && npm run borneo:db:migrate && (npm run borneo:telegram:setup-webhook || true)"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/borneo"
timeout = 300
