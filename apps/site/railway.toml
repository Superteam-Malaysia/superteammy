# Superteam Malaysia site — served at https://my.superteam.fun/
[build]
builder = "NIXPACKS"
# Railpack already runs npm ci; a second npm ci hits EBUSY on node_modules/.cache
buildCommand = "npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/"
timeout = 300
